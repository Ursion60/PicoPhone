# CI/CD PicoPhone : simulateur SDL2 + tests, firmware RP2350B, publication sur tag v*.
name: Build

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Commit MicroPython identique à la copie de build/micropython (genhdr/mpversion.h : 9a3a0c0).
  # Le firmware a besoin d'un vrai clone git : la copie versionnée n'a pas les sous-modules (pico-sdk...).
  MPY_REF: 9a3a0c0d5ea946a4a1b6ff0e3f3087c8adbcac01

jobs:
  simulateur:
    name: Simulateur SDL2 + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: tools/setup-deps.sh sim

      - name: Compilation du simulateur
        run: tools/build_sim.sh

      - name: Compilation MicroPython des applis (mpy-cross)
        working-directory: python
        run: |
          for f in *.py apps/*.py; do
            ../build/micropython/mpy-cross/build/mpy-cross -o /dev/null "$f"
          done

      - name: Tests d'intégration
        working-directory: python
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          MPY=../build/micropython/ports/unix/build-standard/micropython
          rc=0
          for test in ../host/test_*.py; do
            echo "::group::$test"
            timeout 300 "$MPY" "$test" || { echo "::error::échec de $test"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

      - name: Tests depuis les modules précompilés (.mpy, comme sur la carte)
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          ROOT="$PWD"
          B="$RUNNER_TEMP/carte"
          mkdir -p "$B/python/apps" "$B/python/pdfs"
          ln -s "$ROOT/host" "$B/host"
          cp python/main.py "$B/python/"
          cp python/apps/__init__.py "$B/python/apps/"
          cp python/pdfs/*.pdf "$B/python/pdfs/"
          cd python
          for f in i18n.py appkit.py apps/*.py; do
            [ "$f" = apps/__init__.py ] && continue
            "$ROOT/build/micropython/mpy-cross/build/mpy-cross" -o "$B/python/${f%.py}.mpy" "$f"
          done
          cd "$B/python"
          MPY="$ROOT/build/micropython/ports/unix/build-standard/micropython"
          rc=0
          for test in ../host/test_*.py; do
            echo "::group::$test (.mpy)"
            timeout 300 "$MPY" "$test" || { echo "::error::échec de $test en .mpy"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc

      - name: Tests de l'outil de synchro Pronote (CPython, sans réseau)
        run: |
          python3 -m venv "$RUNNER_TEMP/pronote-venv"
          "$RUNNER_TEMP/pronote-venv/bin/pip" install --quiet pronotepy
          "$RUNNER_TEMP/pronote-venv/bin/python" host/cpython/test_sync_pronote.py -v

      - name: Captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-simulateur
          path: /tmp/*.ppm
          if-no-files-found: ignore
          retention-days: 14

      - name: Paquet des applis
        run: |
          mkdir -p dist
          cd python
          zip -r ../dist/picophone-apps.zip main.py appkit.py i18n.py apps/*.py pdfs

      - uses: actions/upload-artifact@v4
        with:
          name: picophone-apps
          path: dist/picophone-apps.zip

  firmware:
    name: Firmware RP2350B
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: tools/setup-deps.sh sim firmware

      - name: Clone de MicroPython
        run: |
          git init -q "$RUNNER_TEMP/micropython"
          cd "$RUNNER_TEMP/micropython"
          git remote add origin https://github.com/micropython/micropython
          git fetch -q --depth 1 origin "$MPY_REF"
          git checkout -q FETCH_HEAD

      - name: Compilation du firmware
        run: MPY_DIR="$RUNNER_TEMP/micropython" tools/build_firmware.sh

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-uf2
          path: firmware/phone_core2350b.uf2

      # Variante expérimentale (jamais exécutée sur la carte) : on vérifie seulement qu'elle compile
      # et que le framebuffer est bien placé en PSRAM (0x11000000...).
      - name: Compilation de contrôle, framebuffer en PSRAM
        run: |
          PHONE_FB_IN_PSRAM=1 MPY_DIR="$RUNNER_TEMP/micropython" tools/build_firmware.sh
          sym="$(arm-none-eabi-nm "$RUNNER_TEMP/micropython/ports/rp2/build-WAVESHARE_RP2350B_CORE-fbpsram/firmware.elf" | grep ' b fb$')"
          echo "$sym"
          case "$sym" in 11*) ;; *) echo "::error::fb n'est pas en PSRAM"; exit 1 ;; esac

  release:
    name: Publication
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [simulateur, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-uf2
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: picophone-apps
          path: dist

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/phone_core2350b.uf2 dist/picophone-apps.zip
