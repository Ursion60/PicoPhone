[package]
name = "picophone-firmware"
version = "0.1.0"
description = "Firmware Rust de PicoPhone pour la Waveshare Core2350B (RP2350B) : écran ILI9341, tactile FT6336U."
edition = "2024"
publish = false

[dependencies]
picophone-gfx = { path = "../crates/picophone-gfx" }
picophone-ui = { path = "../crates/picophone-ui" }
# Versions et fonctionnalités alignées sur les exemples officiels examples/rp235x (tag embassy-rp-v0.10.0).
embassy-rp = { version = "0.10.0", features = ["time-driver", "critical-section-impl", "rp235xb", "binary-info"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = "0.5.1"
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"
panic-halt = "1.0.0"
static_cell = "2.1"
portable-atomic = { version = "1.5", features = ["critical-section"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2          # n'occupe pas de flash (reste dans l'ELF)

[profile.dev]
opt-level = "s"    # un build debug non optimisé est trop gros et trop lent sur la carte
